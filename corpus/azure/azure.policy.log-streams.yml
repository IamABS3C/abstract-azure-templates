id: azure.policy.log-streams
title: Onboard every Azure subscription — current and future — with Azure Policy
cloud: azure
service: Azure Policy (DeployIfNotExists) governing Azure Monitor diagnostic settings
direction: source
transport: event-hub
status: ga
provenance: validated
owner: Solutions Engineering
last_reviewed: '2026-08-25'
summary: 'The answer to the question every customer asks: "do we have to configure diagnostic settings
  on every subscription, and what about subscriptions we create next year?" No, and they onboard themselves.
  Assign this once at a management group and every subscription in it — today''s and every one added later
  — streams to the Abstract Event Hub, and drifts back into compliance if someone deletes a setting. Covers
  the Activity Log, ~140 resource types, Azure SQL auditing and Defender for Cloud export, each of which
  is a SEPARATE Azure mechanism that a naive "just use diagnostic settings" approach misses.'
when_to_use: Any estate with more than about three subscriptions, and any estate that will grow. The per-subscription
  alternative is linear toil that silently falls behind the moment someone creates a subscription without
  telling the security team.
when_not_to_use: A genuine single-subscription estate, or a short pilot where you want one subscription
  onboarded and nothing else touched — use azure.activity-log.subscription for that. Also not for Entra
  ID identity logs, which are tenant-scope and have no subscription to govern.
scopes:
- management-group
covers_future_accounts: true
mechanism_note: 'Azure Policy assignments are inherited down the management-group hierarchy, so a subscription
  placed under the assigned management group is evaluated with no action from anyone, and the DeployIfNotExists
  effect ALSO re-creates a diagnostic setting that someone deletes — the difference between onboarding
  and staying onboarded. CAVEAT, and it matters: new subscriptions land in the TENANT ROOT GROUP by default,
  so this is only unconditionally automatic when assigned at root. At a child management group it is automatic
  ONLY IF the customer''s subscription-vending process places new subscriptions under that group — verify
  that, do not assume it.'
abstract_integration:
  id: default.azure_eventhub.0_7_1
  name: Azure EventHub
  mode: PULL
  verified_on: '2026-08-25'
alternatives_rejected:
- option: Configure diagnostic settings per subscription, by hand or by script
  why_not: Linear effort, and it silently decays. Nothing re-creates a deleted setting, and nothing covers
    a subscription created after the script last ran. This is the status quo the policy pack exists to
    replace.
- option: Azure Landing Zones' built-in Deploy-Diagnostics-* policies
  why_not: 'ALZ''s Deploy-Diagnostics-* definitions target LOG ANALYTICS ONLY and are flagged metadata.deprecated
    true — verified by reading the policy JSON. But do NOT conclude from that that no built-in exists:
    Microsoft''s separate AZURE MONITOR catalogue ships 140 built-in DS_EH_* Event Hub policies and two
    initiatives, and this template already uses them (85175a36 allLogs / 1020d527 audit). Two different
    catalogues; only one is deprecated.'
- option: Azure Verified Modules' diagnostic_settings interface
  why_not: AVM does support Event Hub (event_hub_authorization_rule_resource_id appears across ~40 avm-res-*
    modules), but only for resources YOU deploy through AVM. It cannot retrofit an existing estate. Retrofitting
    is a policy job.
- option: One policy assignment for the whole estate regardless of region
  why_not: Azure Monitor rejects a diagnostic setting whose Event Hub is in a different region from the
    monitored resource. This is not a preference; it is a hard platform constraint and it forces one namespace
    and one assignment PER REGION for regional resources.
decision:
- id: q-dryrun
  question: Report-only first, or deploy immediately?
  why_it_matters: AuditIfNotExists changes nothing and tells you exactly which subscriptions and resource
    types WOULD be onboarded. On an estate nobody has fully inventoried — which is most estates — this
    converts "how many subscriptions do we have and what is in them" from an argument into a list. It
    is also the single best thing to run live on a customer call.
  ask_who: Azure platform/governance owner
  options:
  - value: Report-only first (recommended)
    leads_to: bicep
    note: Set effect=AuditIfNotExists, or enforcementMode=DoNotEnforce. Read the compliance report with
      the customer, then switch.
  - value: Deploy immediately
    leads_to: bicep
    note: Defensible only where the estate is genuinely well understood.
- id: q-regions
  question: Which regions hold regional resources?
  why_it_matters: THE most important design constraint here. Azure Monitor requires the Event Hub to be
    in the same region as the monitored resource, so each region with regional resources needs its own
    namespace, its own auth rule, and its own assignment. Getting this wrong produces a BadRequest at
    remediation time, not at deployment time — so the template looks like it worked. The Activity Log
    is subscription-scope and NOT regional, so one hub serves it everywhere.
  ask_who: Cloud architect — needs the real region inventory, not the intended one
  options:
  - value: One region
    leads_to: bicep
    note: One entry in the regions array. Simplest case.
  - value: Several regions
    leads_to: bicep
    note: One regions[] entry per region, each with its own authorizationRuleId and eventHubName. Deploy
      the Event Hub source stack once per region first.
  - value: Activity Log only, no resource logs
    leads_to: bicep
    note: Set enableResourceLogs=false. The regions array becomes irrelevant — Activity Log is not regional.
- id: q-scope-breadth
  question: Which management group — the tenant root, or a lower one?
  why_it_matters: Assigning at tenant root covers everything but requires a Global Administrator to first
    self-elevate via "Access management for Azure resources," a separate audited step that is routinely
    forgotten and blocks the deployment. A lower management group is easier to get approved and easier
    to pilot with, at the cost of missing subscriptions outside it.
  ask_who: Whoever owns the management-group hierarchy — often not the subscription owners
  options:
  - value: A pilot management group first
    leads_to: bicep
    note: Recommended. Prove the pattern on a subset, then widen the assignment scope.
  - value: Tenant root
    leads_to: bicep
    note: Budget for the Global Admin elevation step. Confirm someone can actually perform it before scheduling.
- id: q-extras
  question: SQL auditing and Defender for Cloud — in scope?
  why_it_matters: Both are SEPARATE Azure mechanisms, not diagnostic settings, so the resource-log initiative
    does not cover them. Teams assume "resource logs" means everything and then discover their SQL audit
    trail was never collected. Each is a deliberate opt-in here.
  ask_who: Security engineering, with the data owners for SQL
  options:
  - value: Diagnostic settings only
    leads_to: bicep
  - value: Add SQL auditing
    leads_to: bicep
    note: enableSqlAuditing=true. Assigned per region like the resource-log initiative.
  - value: Add Defender for Cloud continuous export
    leads_to: bicep
    note: enableDefenderExport=true. Note this one wants a HUB-scoped auth rule, not a namespace-scoped
      one — different from every other policy here. Set perHubSasRules=true in the source stack to get
      one.
- id: q-categories
  question: allLogs or the audit category group for resource logs?
  why_it_matters: allLogs is everything a resource emits; audit is the control-plane and data-access subset.
    The Abstract position is allLogs, because filtering belongs in the pipeline where it can be changed,
    not at the source where changing it means re-remediating the estate. But allLogs on a chatty estate
    is a real volume decision.
  ask_who: Security engineering plus whoever owns the cloud bill
  options:
  - value: allLogs (Abstract default)
    leads_to: bicep
    note: Filter downstream. Reversible without touching the estate.
  - value: audit only
    leads_to: bicep
    note: Lower volume, but you cannot recover what was never exported. Routing is evaluated at write
      time; there is no backfill.
prereqs:
  identity:
  - principal: deployer
    role: Resource Policy Contributor
    scope: the target management group
    why: Create the policy definition and the assignments.
  - principal: deployer
    role: User Access Administrator or Role Based Access Control Administrator
    scope: the target management group
    why: The assignment creates role assignments for the DeployIfNotExists managed identities. People
      expect subscription Owner to be enough; it is not, because the scope is the management group.
    least_privilege_alternative: Role Based Access Control Administrator is narrower than User Access
      Administrator.
  - principal: deployer
    role: Global Administrator, with "Access management for Azure resources" self-elevation
    scope: tenant root management group ONLY
    why: Required only when assigning at the tenant root. It is a separate, audited, easily forgotten
      step, and without it the deployment simply cannot proceed.
  - principal: policy-identity
    role: Monitoring Contributor
    scope: the management group
    why: The remediation identity writes diagnostic settings across in-scope subscriptions.
  - principal: policy-identity
    role: listKeys on the Event Hub authorization rule
    scope: the Event Hubs namespace — usually in a DIFFERENT subscription
    why: Creating a diagnostic setting that streams to an Event Hub requires ListKeys on the target authorization
      rule, which is a separate permission from writing the diagnostic-setting resource. The namespace
      almost always lives in a hub subscription outside the management group being onboarded, so the assignment's
      own scope does not reach it. This is the single most-missed prerequisite in the whole Azure onboarding.
    least_privilege_alternative: A custom role limited to authorizationRules/read plus authorizationRules/listkeys/action.
      The deploy script grants Azure Event Hubs Data Owner, which works but is Microsoft.EventHub/* —
      a remediation identity that can also delete the hub.
  resources:
  - The Event Hub source stack must be deployed FIRST — Azure Policy never creates hubs.
  - One Event Hubs namespace per region that holds regional resources, each with a Send-capable authorization
    rule.
  - The hub names passed here must already exist. See the naming trap in troubleshooting.
  settings:
  - Decide report-only vs enforce before assigning (q-dryrun).
  - Confirm who can perform the Global Admin elevation if assigning at tenant root.
  quotas_limits:
  - MAX 5 DIAGNOSTIC SETTINGS PER RESOURCE. A subscription already exporting to Sentinel plus a storage
    archive plus two other vendors cannot take another, and the failure reads like a quota fault rather
    than a design constraint.
  - Management-group policy assignment names are capped at 24 characters — the template caps namePrefix
    at 6 for this reason.
  lead_time: DeployIfNotExists fires on resource create or update. Existing resources are marked non-compliant
    but NOT fixed until a remediation task runs. Budget time for the remediation pass, and expect it to
    take a while on a large estate.
console_walkthrough:
- step: 1
  action: Confirm the Event Hub namespaces and hubs already exist, in every region you will onboard
  where: Azure portal → Event Hubs
  expected: One namespace per region, each with the hubs the policy will target.
  gotcha: Azure Policy never creates hubs. If a hub name does not exist, every diagnostic setting the
    policy deploys against it fails — and it fails at remediation time, long after the deployment reported
    success.
  image:
    path: assets/diagrams/azure-policy-at-scale.png
    alt: A management group inside the Tenant Root Group carrying a DeployIfNotExists policy assignment
      that reaches existing and new subscriptions, all writing to an Event Hubs namespace that sits outside
      the assignment scope
    caption: 'The assignment binds to the management group, so subscriptions inherit it by containment.
      Two things the picture is deliberately explicit about: a **new subscription lands in the Tenant
      Root Group by default**, so it only inherits if the vending process places it here; and the Event
      Hub is **outside the assignment scope**, so the policy identity''s role there must be granted by
      hand on every IaC-driven deployment.'
    source: drawio
    license: vendor-icon-set
    altered: false
    captured: '2026-08-26'
    tenant_safe: true
- step: 2
  action: Assign in report-only mode
  where: Azure portal → Policy → Assignments, or the CLI at management-group scope
  expected: Compliance results appear within ~30 minutes showing which subscriptions and resources would
    be onboarded.
  gotcha: Do this with the customer watching. It is the most persuasive artifact in the whole engagement.
- step: 3
  action: Grant the remediation identities their roles
  where: The Event Hubs namespace → Access control (IAM), plus the management group
  expected: Each assignment's managed identity holds Monitoring Contributor at the MG and can read the
    hub's auth rule keys.
  gotcha: The assignPermissions/strongType flag on the policy parameter auto-grants ONLY through the portal
    assignment wizard. It does nothing for a Bicep or CLI deployment, which is why a separate grant step
    exists.
- step: 4
  action: Switch the effect to DeployIfNotExists
  where: Policy → Assignments → the assignment → Edit
  expected: New and updated resources onboard themselves from this point on.
  gotcha: This does NOT touch anything that already exists. That is step 5, and skipping it is the most
    common failure.
- step: 5
  action: Run a remediation task to backfill the existing estate
  where: Policy → Remediation → Remediate
  expected: Task completes; compliance rises toward 100%.
  gotcha: Until this runs, the policy is working exactly as designed and collecting nothing from your
    existing resources. Non-compliant is not the same as being fixed.
- step: 6
  action: Verify events are arriving per source
  where: Event Hubs namespace → Metrics → Incoming Messages, then the Abstract console
  expected: Incoming Messages non-zero and rising across the hubs.
  gotcha: Check per hub, not just per namespace. One healthy hub can mask three empty ones.
artifacts:
- kind: bicep
  external_path: templates/azure/bicep/policy/abstract-logstreams-policy.bicep
  provenance: validated
  recommended: true
  scope: managementGroup
  idempotent: true
  destructive_risk: Creates policy definitions, assignments and role assignments at management-group scope.
    Re-running is safe. Changing the effect to DeployIfNotExists starts changing customer resources —
    that is the intended behaviour, but it is the moment it stops being read-only.
  validation:
    command: python3 solutions/scripts/validate-templates.py
    result: 'All 9 template(s) valid. 9 warning(s). — abstract-logstreams-policy.bicep: managementGroup
      / uiFormDefinition / ok'
    run_on: '2026-08-25'
    tool_version: Bicep CLI 0.44.1, Azure CLI 2.87.0
  note: 'Version 1.0, management-group scope. Assigns four things: a CUSTOM DeployIfNotExists policy for
    the Activity Log (defined inline because no Microsoft built-in exists for Activity Log to Event Hub
    — verified 2026-08-03 against the live built-in catalogue; only the Log Analytics variant exists),
    the built-in resource-log initiative per region, the built-in SQL-auditing policy per region, and
    optional Defender for Cloud continuous export. Emits the principal IDs the grant step needs.'
- kind: arm-json
  external_path: templates/azure/bicep/policy/abstract-logstreams-policy.azuredeploy.json
  provenance: validated
  scope: managementGroup
  validation:
    command: 'python3 solutions/scripts/validate-templates.py  # recompiles every .bicep and fails if
      the committed ARM is stale'
    result: no drift — committed ARM matches the Bicep source; independently reproduced [MATCH] on all
      9 templates
    run_on: '2026-08-25'
    tool_version: Bicep CLI 0.44.1
- kind: arm-ui
  external_path: templates/azure/bicep/policy/abstract-logstreams-policy.uiFormDefinition.json
  provenance: validated
  scope: managementGroup
  validation:
    command: python3 solutions/scripts/validate-templates.py
    result: 'ok — warn: 2 optional parameter(s) use defaults: defenderExportedDataTypes, resourceTypeList'
    run_on: '2026-08-25'
  note: A Form view, not a createUiDefinition — the common createUiDefinition model physically cannot
    bind a portal deployment above a resource group, so management-group and tenant scopes require Form
    view. This is why most vendor solutions do not offer a portal path at this scope at all.
- kind: azure-cli
  provenance: schema-reviewed
  scope: managementGroup
  inline: "# 1. Assign in REPORT-ONLY mode first — changes nothing, tells you everything.\naz deployment\
    \ mg create \\\n  --management-group-id <mg-id> --location eastus \\\n  --template-file solutions/templates/policy/abstract-logstreams-policy.bicep\
    \ \\\n  --parameters @solutions/parameters/logstreams-policy.parameters.json \\\n               effect=AuditIfNotExists\n\
    \n# 2. Read the compliance picture before changing anything.\naz policy state summarize --management-group\
    \ <mg-id>\n\n# 3. Grant the remediation identities rights on the hub, then switch to enforcing.\n\
    ./solutions/scripts/Deploy-AbstractLogStreams.sh -a Grant -m <mg-id> -n <namespace-resource-id>\n\n\
    # 4. Backfill the EXISTING estate. Without this, nothing already-deployed is onboarded.\n./solutions/scripts/Deploy-AbstractLogStreams.sh\
    \ -a Remediate -m <mg-id>\n"
  note: The wrapper script exists because the raw az remediation commands need a per-subscription loop
    in some tenants. Prefer the script.
- kind: bash
  external_path: templates/azure/scripts/Deploy-AbstractLogStreams.sh
  provenance: validated
  scope: managementGroup
  validation:
    command: bash -n over every *.sh (the repo CI shell-lint job, run locally)
    result: ok — parses clean
    run_on: '2026-08-25'
  note: Actions are Deploy, Grant and Remediate. Run them in that order; each depends on the last.
- kind: terraform
  provenance: schema-reviewed
  scope: managementGroup
  inline: "# There is NO off-the-shelf module for this. Verified 2026-08-25: ALZ's\n# Deploy-Diagnostics-*\
    \ policies are Log-Analytics-only and deprecated; AVM only\n# covers resources you deploy through\
    \ AVM; no Azure-org module targets Event Hub\n# at scale. Written to the current provider schema;\
    \ NOT validated or applied.\n\nresource \"azurerm_policy_definition\" \"activity_log_to_eventhub\"\
    \ {\n  name                = \"abs-activitylog-to-eventhub\"\n  policy_type         = \"Custom\"\n\
    \  mode                = \"All\"\n  display_name        = \"Stream Azure Activity Log to the Abstract\
    \ Event Hub\"\n  management_group_id = var.management_group_id\n  # policy_rule: a DeployIfNotExists\
    \ on Microsoft.Insights/diagnosticSettings\n  # with an existenceCondition. Model it on Microsoft's\
    \ Log Analytics built-in\n  # (2465583e-...) and swap the destination — do NOT hard-code a category\
    \ COUNT\n  # in the existenceCondition; a new Azure category makes every subscription\n  # non-compliant\
    \ overnight.\n  policy_rule = file(\"${path.module}/policy-rule.json\")\n}\n\nresource \"azurerm_management_group_policy_assignment\"\
    \ \"activity_log\" {\n  name                 = \"abs-activitylog\"\n  management_group_id  = var.management_group_id\n\
    \  policy_definition_id = azurerm_policy_definition.activity_log_to_eventhub.id\n  location      \
    \       = var.assignment_location\n  identity { type = \"SystemAssigned\" }\n}\n\n# The identity needs\
    \ Monitoring Contributor at the MG *and* listKeys on the\n# auth rule, which usually lives in a different\
    \ subscription.\nresource \"azurerm_role_assignment\" \"monitoring\" {\n  scope                = var.management_group_id\n\
    \  role_definition_name = \"Monitoring Contributor\"\n  principal_id         = azurerm_management_group_policy_assignment.activity_log.identity[0].principal_id\n\
    }\n"
  note: 'For Terraform-only platform teams. Be explicit that this is the reduced version: the Bicep pack
    also handles per-region assignment, SQL auditing, Defender export and the grant sequencing. Pulumi
    and CDKTF wrap the same azurerm provider and inherit the same gaps.'
delivery_surfaces:
- console
- cli
- azure-policy
- ci-github-actions
- ci-azure-devops
- landing-zone
verification:
- check: The assignments exist and carry managed identities
  where: cloud-cli
  command: az policy assignment list --scope /providers/Microsoft.Management/managementGroups/<mg-id>
    --query "[].{name:name,identity:identity.principalId,enforcement:enforcementMode}"
  healthy: One assignment per enabled feature, each with a non-null principalId.
  unhealthy_means: A null identity means the assignment was created without SystemAssigned identity and
    can never remediate.
- check: Compliance is being evaluated
  where: cloud-cli
  command: az policy state summarize --management-group <mg-id>
  healthy: Non-zero resource counts, with non-compliant resources listed before remediation and falling
    after.
  unhealthy_means: Zero evaluated resources means the assignment scope is wrong or evaluation has not
    run yet — allow ~30 minutes.
- check: A remediation task actually ran and succeeded
  where: cloud-console
  healthy: Policy → Remediation shows a completed task, not merely a compliance report.
  unhealthy_means: THIS IS THE ONE PEOPLE MISS. Non-compliant with no remediation task means the policy
    is working exactly as designed and collecting nothing from existing resources.
- check: Diagnostic settings now exist on a sample resource
  where: cloud-cli
  command: az monitor diagnostic-settings list --resource <resource-id> --query "[].{name:name,eventHub:eventHubName}"
  healthy: A setting named per diagnosticSettingName, pointing at the expected hub.
  unhealthy_means: Absent after a successful remediation task points at the ListKeys grant or the region
    rule.
- check: Events are arriving per hub, and then in Abstract
  where: cloud-console
  healthy: Incoming Messages non-zero on EVERY hub the policy targets, then matching events in the Abstract
    tenant.
  unhealthy_means: One healthy hub can mask three empty ones — check per hub, not per namespace.
troubleshooting:
- symptom: Everything reports non-compliant and nothing is ever fixed
  likely_cause: No remediation task has been run. DeployIfNotExists evaluates on resource create or update;
    during an evaluation cycle it MARKS matching resources non-compliant and takes no action.
  check: Policy → Remediation. Is there a task at all?
  fix: Run Deploy-AbstractLogStreams.sh -a Remediate. Expect it to take a while on a large estate.
- symptom: Remediation fails with AuthorizationFailed against a bare GUID
  likely_cause: The remediation identity lacks a role on something outside the assignment scope — almost
    always ListKeys on the Event Hub authorization rule, because the namespace lives in a hub subscription
    outside the management group.
  check: Policy → Remediation → the failed task → Related events. The error names the principal by object
    ID only, with no display name, which is why operators cannot identify it.
  fix: Grant the identity read plus listKeys on the auth rule. Deploy-AbstractLogStreams.sh -a Grant does
    this.
- symptom: Resource-log diagnostic settings fail with a region error
  likely_cause: The Event Hub is in a different region from the monitored resource. Azure Monitor rejects
    this outright — "Resources should be in the same region."
  check: Compare the region of the failing resource against the region of the hub in that regions[] entry.
  fix: One namespace and one assignment PER REGION. Add the region to the regions array with its own authorizationRuleId
    and eventHubName. Note the Activity Log is subscription-scope and NOT regional, so it is unaffected.
- symptom: Activity Log works but every resource-log setting fails
  likely_cause: The hub name does not exist. The source stack's default hubSources are activity, entra
    and defender — it does NOT create a resource hub — while this policy defaults to abs-prod-resource.
    The two defaults do not line up.
  check: az eventhubs eventhub list, and compare against activityLogEventHubName and each regions[].eventHubName.
  fix: Add "resource" to the source stack's hubSources and redeploy it, or point the policy at a hub that
    exists. Azure Policy never creates hubs.
- symptom: Some subscriptions never onboard, and nobody can say why
  likely_cause: A policy exemption, an assignment flipped to enforcementMode DoNotEnforce, or the effect
    quietly changed to AuditIfNotExists. All three look benign in a portal and all three are parameters
    this template exposes.
  check: az policy exemption list, and the assignment's enforcementMode and effect.
  fix: Alert on policyExemptions/write and policyAssignments/write at the management group. The stronger
    detector is volumetric and lives in Abstract — "subscription X stopped delivering" beats "someone
    wrote an exemption."
  silent: true
- symptom: A subscription cannot take the diagnostic setting at all
  likely_cause: The 5-diagnostic-settings-per-resource limit is already consumed by Sentinel, an archive
    and other vendors.
  check: az monitor diagnostic-settings list on the failing resource and count them.
  fix: Consolidate an existing setting. There is no way to raise the limit.
- symptom: SQL audit trails or Defender alerts are missing even though resource logs work
  likely_cause: Both are separate Azure mechanisms, not diagnostic settings, so the resource-log initiative
    does not cover them. They are opt-in here for exactly that reason.
  check: Confirm enableSqlAuditing and enableDefenderExport.
  fix: Enable them. Note the Defender export wants a HUB-scoped auth rule, unlike every other policy here
    which wants a namespace-scoped one.
cost:
  drivers:
  - driver: Azure Policy assignments, evaluations and remediation tasks
    charged_on: nothing — Azure Policy is free
    side: customer-cloud
    note: Worth saying out loud. The governance layer costs nothing; only the hub and the volume do.
  - driver: Diagnostic settings themselves
    charged_on: nothing
    side: customer-cloud
  - driver: The volume this ONBOARDS — Event Hub ingress, throughput units, egress
    charged_on: see the Event Hub node's cost model
    side: customer-cloud
    note: This policy is a volume multiplier. It is the thing that turns three subscriptions into ninety.
  surprise_line: allLogs across ~140 resource types on an estate nobody has inventoried. The policy is
    free; what it switches on is not. Run in report-only mode FIRST and read the resource counts before
    enforcing — that report is the only honest input to a volume estimate.
  volume_shape: Scales with subscription count times resource count, not with anything you control directly.
    An estate that grows adds volume automatically — which is the point, and also the bill.
  savings:
  - One assignment replaces per-subscription configuration effort permanently, including for subscriptions
    that do not exist yet.
  - Self-healing means no recurring audit-and-repair cycle.
detections_unlocked:
- detection: Diagnostic setting deleted (the blinding attack) — and automatically restored
  acs_fields:
  - action
  - related.user
  mitre:
  - T1562.008
- detection: Policy exemption created to carve a subscription out of monitoring
  acs_fields:
  - action
  - related.user
  mitre:
  - T1562.001
- detection: Subscription stopped delivering (volumetric, absence-of-data)
  acs_fields:
  - cloud.project_id
  mitre:
  - T1562.008
reviews:
  cloud_architect: ''
  devops: ''
  security_iam: 'Three grants, and the one people skip is the third.


    The **deployer** needs role-assignment write **at the management group**. Subscription Owner is not
    enough — that surprises almost everyone. At tenant root it is worse: a Global Administrator must first
    self-elevate through "Access management for Azure resources." That is a separate, audited step, and
    it routinely blocks a deployment mid-call.


    The **remediation identity** needs Monitoring Contributor at the MG, plus ListKeys on the Event Hub
    authorization rule.


    That second grant is the trap. The namespace almost always lives in a hub subscription **outside the
    assignment scope**, so it is a separate action nobody schedules. Skip it and you get `AuthorizationFailed`,
    naming the principal by bare object ID with no display name — an error that tells you nothing about
    which identity to fix.


    Prefer a **custom role** limited to `authorizationRules/read` plus `listkeys/action`. The obvious
    alternative, Azure Event Hubs Data Owner, grants `Microsoft.EventHub/*` — which lets a remediation
    identity delete the hub it is supposed to write to.'
  finops: ''
  soc: ''
faq:
- q: Do we have to configure diagnostic settings on every subscription?
  a: No. Assign this once at a management group and every subscription in it is onboarded. This is the
    question customers actually ask, and this node is the answer.
  asked_by: Recurring — asked on essentially every Azure onboarding
- q: What about subscriptions we create next year?
  a: Automatically included. Policy assignments are inherited down the management-group hierarchy, so
    a subscription created later and placed under the MG is evaluated with no action from anyone.
  asked_by: Recurring
- q: What if someone deletes a diagnostic setting?
  a: DeployIfNotExists puts it back. That self-healing property is the real difference between onboarding
    and staying onboarded, and it is something per-subscription configuration fundamentally cannot do.
- q: Can we see what this would do before it changes anything?
  a: Yes, and you should. Run with effect=AuditIfNotExists. It changes nothing and reports exactly which
    subscriptions and resource types would be onboarded. Run it live on a call — it is usually the most
    persuasive artifact in the engagement.
- q: Why do we need a separate Event Hub per region?
  a: Azure Monitor rejects a diagnostic setting whose Event Hub is in a different region from the monitored
    resource. It is a hard platform constraint, verified empirically. The Activity Log is subscription-scope
    and not regional, so a single hub serves it everywhere.
- q: Doesn't Azure Landing Zones already do this?
  a: Not to an Event Hub. ALZ's Deploy-Diagnostics-* policies target Log Analytics only and are flagged
    deprecated in their own JSON. Their per-resource-type category lists are worth forking; their destination
    logic is not.

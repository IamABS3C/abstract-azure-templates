verification:
- check: The namespace exists, is Active, and the hubs and consumer group were created
  where: cloud-cli
  command: 'az eventhubs namespace show -g rg-abstract -n <namespace> --query "{status:status,sku:sku.name,tls:minimumTlsVersion}"

    az eventhubs eventhub list -g rg-abstract --namespace-name <namespace> --query "[].name"

    az eventhubs eventhub consumer-group list -g rg-abstract --namespace-name <namespace> --eventhub-name
    <hub> --query "[].name"

    '
  healthy: Status "Active", SKU Standard, and a consumer group named "abstract" alongside $Default.
  unhealthy_means: If only $Default exists you are on Basic, or the consumer group step was skipped.
- check: Messages are actually arriving in the hub — i.e. the PRODUCER side works
  where: cloud-console
  healthy: Namespace → Metrics → Incoming Messages shows a non-zero, continuous line after a diagnostic
    setting has been pointed at the hub.
  unhealthy_means: Zero incoming means no producer is writing. The hub is fine; the diagnostic setting
    is missing, misconfigured, or blocked by the namespace firewall. Do not debug Abstract for this.
- check: Abstract is consuming — i.e. the CONSUMER side works
  where: cloud-console
  healthy: Namespace → Metrics → Outgoing Messages tracks Incoming Messages. A persistent gap between
    the two means events are arriving faster than they are being read.
  unhealthy_means: Incoming healthy but Outgoing flat = the consumer is not connected. Check credentials,
    the consumer group name, and (AMQP mode) the checkpoint container.
- check: Events are landing in Abstract and parsing into ACS
  where: abstract-ui
  healthy: Search the tenant for events from the Azure integration over the last 15 minutes and confirm
    a non-zero count.
  unhealthy_means: Outgoing Messages non-zero but nothing in Abstract points at the parser or the pipeline,
    not the transport.
- check: The fields that matter are populated, not just the byte count
  where: abstract-ui
  healthy: Spot-check cloud.project_id (the SUBSCRIPTION id), cloud.origin.account_id (the tenant id),
    related.user, and cloud.region on a sample event.
  unhealthy_means: Events arriving with empty identity fields means the parser matched a generic path.
    Note that 0.7.1 specifically fixed subscription/tenant confusion in cloud.project_id and user identity
    being dropped on Key Vault events — if you see those symptoms, check the integration version before
    debugging anything else.
troubleshooting:
- symptom: Abstract shows zero events, and no error anywhere
  likely_cause: Abstract is pointed at the $Default consumer group, which something else is also reading.
    The two consumers split partition leases between them, so each sees a fraction of the stream and neither
    reports a fault.
  check: Confirm the integration's consumer-group field is "abstract", and that nothing else uses that
    group.
  fix: Create and use a dedicated consumer group per consumer. Never share one.
  silent: true
- symptom: Incoming Messages is zero after creating a diagnostic setting
  likely_cause: The namespace firewall is in Deny mode because allowedIpRanges was populated, and allowAzureServices
    was left false — so Azure Monitor's own delivery is blocked.
  check: Namespace → Networking. Look at the default action and the trusted-services bypass.
  fix: Set allowAzureServices=true. Azure Monitor delivery is a trusted-service path and needs that bypass
    whenever the firewall denies by default.
- symptom: The consumer restarts and replays events it has already processed
  likely_cause: AMQP ingestion mode with no reachable checkpoint container, so no offset is ever committed.
  check: Confirm the storage account and the private blob container exist and that Abstract has Storage
    Blob Data Contributor on them.
  fix: Create the container, grant the role. Or switch to Kafka ingestion mode, which commits offsets
    to Event Hubs and needs no storage at all.
- symptom: Policy assignment reports subscriptions non-compliant, but nothing is ever fixed
  likely_cause: DeployIfNotExists evaluates on resource create/update. During an evaluation cycle it MARKS
    matching resources non-compliant and takes no action. Without a remediation task, the existing estate
    never onboards.
  check: Azure Policy → Remediation. Is there a task at all, and did it run?
  fix: Create and run a remediation task. The Deploy-AbstractLogStreams.sh -a Remediate action does this.
- symptom: The IP allowlist you configured is not in effect
  likely_cause: 'safeMode is on, and the template computes effectiveIpRules = safeMode ? [] : cleanedIpRanges
    — so safeMode SILENTLY DISCARDS allowedIpRanges. The deployment succeeds and reports no warning.'
  check: Namespace → Networking. Compare the rules present against what you passed.
  fix: Turn safeMode off if you actually want the allowlist enforced. Verify in the portal rather than
    trusting the deployment output.
- symptom: Remediation task fails with AuthorizationFailed against a bare GUID
  likely_cause: The policy assignment's managed identity lacks a role on a resource outside the assignment
    scope — almost always listKeys on the Event Hub authorization rule when the namespace lives in a different
    subscription.
  check: Policy → Remediation → the failed task → Related events. The message names the principal by object
    ID only, with no display name, which is why operators cannot identify it.
  fix: Grant the remediation identity read + listKeys on the authorization rule. Note the assignPermissions/strongType
    flag on the policy parameter is a PORTAL-ONLY convenience and does nothing for a Bicep or CLI deployment.
- symptom: Deployment fails partway — the namespace is created but the role assignment 403s
  likely_cause: The deployer has Contributor, which can create resources but cannot create role assignments.
    Granting RBAC is a separate right.
  check: az role assignment list --assignee <deployer> --scope <rg> and look for Owner, User Access Administrator,
    or RBAC Administrator.
  fix: Grant Role Based Access Control Administrator on the resource group, then re-run. The deployment
    is idempotent.
- symptom: Role assignment fails with PrincipalNotFound on a freshly created service principal
  likely_cause: Entra directory replication delay — the SP exists but is not yet visible to ARM.
  check: Confirm the object ID is the Enterprise Application object ID, not the app/client ID.
  fix: The template sets principalType=ServicePrincipal specifically to avoid this. If hand-rolling, set
    it, or wait a few minutes and re-run.
- symptom: Throughput is capped and events lag behind during bursts
  likely_cause: Throughput Unit saturation, or more consumers than partitions.
  check: Namespace → Metrics → Throttled Requests. Compare num_consumers against the hub's partition count.
  fix: Enable Auto-Inflate with a sensible ceiling. Never set num_consumers above the partition count
    — surplus consumers get no partition and idle. If partitions are the constraint, you must create a
    new hub; Standard cannot resize them.
- symptom: The checkpoint container was lost and a chunk of buffered data vanished
  likely_cause: With no checkpoint the processor resumes from its configured DEFAULT POSITION. If that
    default is "latest", everything still buffered in the hub is skipped rather than read.
  check: Confirm the checkpoint container exists and holds lease blobs per partition.
  fix: Treat the checkpoint account as production state, not scratch. Consider Kafka ingestion mode, which
    commits offsets to Event Hubs and removes this failure mode entirely.
  silent: true
- symptom: The consumer stopped and nothing alerted, because no metric went red
  likely_cause: Event Hubs publishes NO consumer-lag metric on Standard (ConsumerLag exists only in ApplicationMetricsLogs
    on Premium/Dedicated). IncomingMessages stays perfectly healthy while nothing is being read, so every
    naive dashboard looks fine.
  check: Compare OutgoingBytes and ActiveConnections against IncomingMessages. A stopped consumer is OutgoingBytes
    -> 0 with IncomingMessages unchanged.
  fix: Deploy azure.event-hub.health-alerts, which does exactly this — a log-search rule whose KQL always
    returns a row, because sparse metrics emit nothing rather than zero and a metric alert on "nothing"
    never fires. It also covers ingestion-stopped, throttling, credential errors and quota ceilings.
  silent: true
- symptom: The Event Hubs bill stepped up after a traffic spike and never came back down
  likely_cause: Auto-Inflate scales throughput units UP and, per Microsoft, does not scale them back down.
    One spike sets a permanent new floor — and because Capture is metered per TU, it inflates that line
    too.
  check: Namespace -> Scale. Compare current TUs against steady-state need. Review AutoScaleLogs.
  fix: Lower the TU count by hand and set maxThroughputUnits to a considered ceiling rather than a comfortable
    one. The template ships capacity=1 with a 20x ceiling and no alert.
- symptom: Removing a hub from hubSources does not remove the hub
  likely_cause: ARM Incremental mode is additive-only and never reconciles removals.
  check: Compare az eventhubs eventhub list against the hubSources parameter.
  fix: Delete the orphan explicitly, or use deployment stacks with --action-on-unmanage deleteResources.
    Note that renaming via hubPrefix/environment/namespaceName does the same thing — it orphans the old
    hub AND every Abstract integration pointed at it.
- symptom: Data is missing for a period after an outage, and cannot be recovered
  likely_cause: Retention expired while the consumer was down. Basic tier is 1 day; Standard defaults
    can be as low as 1.
  check: Event Hub → Properties → Message retention.
  fix: Set retention to 7 days on Standard. Retention is your entire recovery window — size it for a long
    weekend, not an afternoon.
  silent: true
- symptom: Duplicate events downstream
  likely_cause: Delivery is at-least-once by design. A crash before offset commit, or a consumer group
    rebalance, replays the uncommitted batch.
  check: Correlate on partition plus offset/sequence number.
  fix: Expected behaviour, not a defect — 0.7.0 hardened both paths to strict at-least-once deliberately.
    Deduplicate downstream on partition + offset if exactly-once matters.
cost:
  drivers:
  - driver: Throughput Units (Standard) or Processing Units (Premium)
    charged_on: provisioned unit-hours
    side: customer-cloud
    note: A STEP function, not linear. You pay for provisioned capacity whether or not you use it.
  - driver: Ingress events
    charged_on: per million events
    side: customer-cloud
  - driver: Checkpoint storage account
    charged_on: capacity plus transactions
    side: customer-cloud
    note: Small, and avoidable entirely in Kafka ingestion mode.
  - driver: Bandwidth out of Azure to Abstract
    charged_on: GB egressed
    side: customer-cloud
  - driver: Capture (if enabled)
    charged_on: per throughput unit-hour, plus the destination storage
    side: customer-cloud
    note: Off by default. Do not enable it unless something actually reads the captured files.
  - driver: Diagnostic settings and Azure Policy assignments
    charged_on: nothing — these are free
    side: customer-cloud
    note: Worth saying out loud. The governance layer costs nothing; only the hub does.
  surprise_line: Auto-Inflate scales Throughput Units UP automatically and never scales them back DOWN.
    One traffic spike silently sets a new floor on the monthly bill, and nobody notices because nothing
    failed. Review provisioned TUs monthly and lower them by hand.
  volume_shape: 'TU = max(peak MB/s, peak events/s / 1000, peak egress / 2), sized on a MEASURED peak,
    not an average — then check retained volume against the 84 GB-per-TU included allowance. Going over
    bills the overage rather than losing data, so that is a budgeting check, not a capacity one. 100 GB/day
    lands at ~4 TU with 8 partitions provisioned. 1 TB/day at a 3x peak needs ~37 TU and ~37 partitions
    and therefore DOES NOT FIT STANDARD AT ALL — 40 TU ceiling and a hard, immutable 32-partition limit
    — forcing either multiple namespaces or ~6 PU of Premium. Microsoft publishes the category ratio:
    non-interactive and service-principal sign-ins run 5-10x larger than interactive sign-ins.'
  savings:
  - One namespace serving the whole estate rather than one per subscription.
  - Kafka ingestion mode removes the checkpoint storage account entirely.
  - Selecting diagnostic-setting categories deliberately rather than exporting allLogs.
reviews:
  cloud_architect: 'Event Hubs is the correct buffer for Azure-native security telemetry. But it is a
    buffer with a **hard clock** and, on Standard, no consumer-side instrumentation.


    Standard tops out at 7 days retention and includes 84 GB of event storage per throughput unit. That
    84 GB is an **allowance, not a cap** — a 1-TU namespace holding a busy estate for seven days produces
    a surprise bill, not dropped data. The clock is the hard limit; the 84 GB is the expensive one.


    **Shape the deployment around the three things that are immutable at create time.**


    - **Region.** Azure Monitor rejects any diagnostic setting whose regional source and hub disagree.
    That forces one namespace and one policy assignment per region for resource logs. Activity Log, Entra
    and Defender are scope-free and need only one.

    - **Partition count.** Unchangeable on Standard. It caps per-hub throughput and consumer parallelism
    at the same time, and it costs nothing — so never leave it at 4.

    - **Tier.** Only Premium reaches 90-day retention, geo-replication and dynamic partition scale-out.


    Put the namespace in a dedicated platform subscription, so workload owners cannot delete their own
    audit trail.


    **The least-obvious failure mode is compound, and on Standard no Azure alarm covers any part of it:**


    1. There is no consumer-lag metric on that tier, so a stalled reader is invisible.

    2. Retention then expires with no metric, no log and no dead-letter.

    3. If the checkpoint container is lost, the processor resumes from its configured default position
    — and if that default is "latest", everything still buffered is silently discarded.


    Three independent paths to permanent, unalarmed loss of security logs, all while every health dashboard
    stays green.'
  devops: '**The artifact is additive-only.** ARM Incremental mode never reconciles removals, so a hub
    dropped from `hubSources` keeps running and keeps billing.


    **`hubPrefix`, `environment`, `hubSources` and `namespaceName` are effectively immutable.** Changing
    any of them renames a hub and silently orphans it — along with every Abstract integration pointed
    at it.


    **Partition count is the classic replacement trap, and the answer is tier-dependent.** On Basic and
    Standard it cannot be changed after creation at all. Only Premium and Dedicated allow an increase,
    never a decrease. Over-provision at creation: partitions are free, because billing follows TUs and
    PUs.


    **The subtler trap is Auto-Inflate mutating `sku.capacity` server-side.** Every `what-if` then shows
    a phantom capacity diff, and every re-apply either deflates the namespace or must explicitly ignore
    the field. Treat `what-if` as a review aid here — never as a "must be empty" CI gate.


    **Terraform reaches parity**, including the tenant-scope `azurerm_monitor_aad_diagnostic_setting`,
    and adds the removal reconciliation Bicep lacks. What it loses is the portal Deploy-to-Azure button
    that makes customer-run onboarding work.


    **Day 2 is dominated by one gap.** Event Hubs publishes no consumer-lag metric **on Standard** — `ConsumerLag`
    exists only in ApplicationMetricsLogs on Premium and Dedicated, which is a genuine argument for Premium.
    On Standard, a silently-stopped consumer is visible only as `OutgoingBytes` and `ActiveConnections`
    falling to zero while `IncomingMessages` stays healthy.'
  security_iam: 'Use a **split-credential** design.


    **Consumer side — Entra service principal.** Azure Event Hubs Data Receiver (`a638d3c7-ab3a-418d-83e6-5f17a39d4fde`)
    scoped to a single consumer group, with event-hub scope as the tested fallback. Plus Storage Blob
    Data Contributor scoped to the checkpoint **container** — never the namespace, never the whole storage
    account.


    **Producer side — a separate Send-purposed SAS rule.** Azure Monitor''s Event Hubs destination is
    defined entirely in terms of a shared access policy and has no managed-identity option. So while diagnostic
    settings are a producer, a fully SAS-free namespace is impossible.


    That asymmetry is the most misunderstood fact in this pipeline.


    **The permission surprises that stall onboardings are about scope HEIGHT, not role name:**


    - Entra tenant diagnostic settings need the **Security Administrator directory role**. An Azure subscription
    Owner cannot do it. Neither can a management-group Owner.

    - Management-group policy assignment needs role-assignment write **at the MG**.

    - Microsoft Graph **application** permissions can only be consented by Privileged Role Administrator
    or Global Administrator.'
  finops: 'Cost is TU-hours × rate, plus ingress events, Capture, retention overage, checkpoint transactions,
    egress, and platform-log export. **The shape matters more than the rates.**


    Throughput units are a **step function** — whole units, billed hourly, 1-hour minimum, 40 maximum,
    where 1 TU = 1 MB/s or 1,000 events/s. Capture on Standard is a step billed per month per TU. The
    84 GB-per-TU retention allowance is another step boundary. Only ingress events, blob transactions
    and egress are linear.


    **The surprise line is Auto-Inflate.** It scales throughput units up and, in Microsoft''s own words,
    "doesn''t automatically scale down the number of TUs when ingress or egress rates drop below the limits."


    So one traffic spike ratchets the namespace to a higher step **permanently** — and because Capture
    is metered per TU, it silently inflates that bill too. The template ships `capacity=1` with `maxThroughputUnits=20`:
    a 20× ceiling with no alert and no deflate job anywhere.


    **Close seconds:**


    - Egress to a SaaS consumer outside the region — roughly 30 TB/month at 1 TB/day

    - Retained-but-undelivered messages when a consumer stalls

    - Capture left on "just in case", writing empty files as billable blob writes

    - The Azure Monitor **platform-logs per-GB export charge**, which everyone models at zero because
    the diagnostic-setting resource itself is free


    **Sizing:** TU = max(peak MB/s, peak events/s ÷ 1000, peak egress ÷ 2).


    100 GB/day lands at about 4 TU with 8 partitions. 1 TB/day at 3× peak needs about 37 TU and 37 partitions
    — and **therefore does not fit Standard at all**, which ceilings at 40 TU and hard-caps partitions
    at 32, immutably. That forces multiple namespaces, or roughly 6 PU of Premium.'
  soc: '**Highest value per GB is the Activity Log `Administrative` category** — every ARM create/update/delete
    and every RBAC change. By Microsoft''s own statement it "doesn''t typically capture read operations",
    so it stays small.


    **Then, in order:** Entra `AuditLogs`; Entra interactive `SignInLogs`; Activity Log `Security` (Defender
    alerts, effectively free); and Key Vault `AuditEvent` — the **only** place secret reads (`SecretGet`)
    are visible, because the subscription Activity Log carries management-plane vault operations only.


    **Defer** `NonInteractiveUserSignInLogs`, Storage `StorageRead` and AKS `kube-audit` until volume
    is measured.


    **Eligibility fact that changes sizing: NSG and VNet flow logs cannot reach an Event Hub at all.**
    The `flowLogs` resource has a required `storageId` and no Event Hub property. So Azure''s overall
    volume monster never touches this pipeline. The Event-Hub-eligible monster is AKS `kube-audit` — use
    `kube-audit-admin`, which excludes `get` and `list`.


    **In Abstract specifically,** `azure_eventhub` 0.7.1 maps `operationName` to a **flat** `action` field
    — there is no `event.action` in ACS. It maps `callerIpAddress` to `source_address`, `resultType` to
    `event.outcome`, `correlationId` to `event.id`, and writes the raw Azure category into `event.category`.
    That last one is a dynamic text field where `term` and `match` **silently return zero**, so query
    it with `query_string`.


    Two planning notes: roughly half of a serious Entra detection set needs the `microsoft_graph_api`
    poll rather than Event Hub. And expect a **24-hour-to-3-day first-data delay** on Entra, with no backfill
    — do not declare it broken on day one.'
faq:
- q: Do we need one Event Hub per subscription?
  a: No. One namespace, with one hub per LOG SOURCE, serves an entire estate — dozens of subscriptions
    all deliver into the same hubs. Scale the namespace's throughput units, not the number of namespaces.
  asked_by: Recurring — asked on most Azure onboardings
- q: Will subscriptions we create next year be included automatically?
  a: 'Not by this template on its own — it builds the hub, which has no notion of subscriptions. Assign
    the log-streams policy at a management group and the answer becomes yes: current and future subscriptions
    onboard themselves, and a deleted diagnostic setting is put back.'
  asked_by: Recurring
- q: Can we avoid handing over a connection string?
  a: Yes. Set enableRbac=true and give Abstract's service principal the Azure Event Hubs Data Receiver
    role on the namespace. Set enableSas=false to disable local auth entirely. Use the Enterprise Application
    object ID, not the client ID.
  asked_by: Recurring — every regulated customer
- q: Do we really need the storage account?
  a: Only in AMQP ingestion mode, where it holds the consumer's checkpoints. In Kafka mode (Standard tier
    and above, added in integration 0.7.0) offsets commit to Event Hubs and no storage account is needed.
    Decide the mode before you deploy.
- q: What happens if the Abstract consumer is down for a weekend?
  a: Nothing is lost as long as the outage is shorter than the hub's message retention. That is exactly
    what retention is for — set it to 7 days on Standard. At Basic's 1-day ceiling, a Friday-evening outage
    is unrecoverable by Monday.

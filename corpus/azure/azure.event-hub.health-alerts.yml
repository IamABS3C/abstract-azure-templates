id: azure.event-hub.health-alerts
title: Know when the Azure pipeline stops — Event Hub health alerts
cloud: azure
service: Azure Monitor alert rules over an Event Hubs namespace
direction: source
transport: event-hub
status: ga
provenance: validated
owner: Solutions Engineering
last_reviewed: '2026-08-25'
summary: 'Every other Azure node gets data flowing. This one tells you when it stops — which on this pipeline
  is otherwise close to undetectable. Azure Event Hubs publishes no consumer-lag metric on Standard (ConsumerLag
  exists only in ApplicationMetricsLogs on Premium/Dedicated), so when the Abstract consumer stalls, incoming
  messages keep arriving, no error is raised anywhere, every Event Hubs dashboard stays green, and message
  retention quietly expires the backlog. After that the data is gone permanently, with no metric, no log
  and no dead-letter. The only observable signal is inferential: outgoing traffic collapsing while incoming
  traffic continues.'
when_to_use: Immediately after the Event Hub source node, on every deployment. This is not an optional
  hardening step — without it the most likely serious failure on the path is invisible until someone happens
  to notice missing data days later.
when_not_to_use: 'Nothing here replaces absence-of-data alerting on the Abstract side, which catches the
  failures that happen AFTER the hub. Both layers are needed: this one tells you the consumer stopped
  reading; the Abstract-side alert tells you a source stopped producing.'
scopes:
- resource-group
covers_future_accounts: false
mechanism_note: Alert rules bind to one namespace. A multi-region estate needs one deployment per namespace.
alternatives_rejected:
- option: A metric alert on OutgoingBytes falling below a threshold
  why_not: 'This is the obvious approach and it DOES NOT WORK. Event Hubs metrics are sparse: when nothing
    is consuming, the platform emits no outgoing datapoints at all rather than emitting zeros. A metric
    alert therefore has nothing to evaluate, sits in "Insufficient data" indefinitely, and never fires.
    The rule looks correct in the portal and is inert.'
- option: Alert on consumer lag
  why_not: There is no such metric. Event Hubs has no equivalent of Kafka's consumer offset lag. This
    is the root cause of the whole problem and the reason the detection must be inferential.
- option: A metric alert on NamespaceCpuUsage for the Auto-Inflate cost ratchet
  why_not: Tried and REMOVED during authoring. NamespaceCpuUsage is a Premium-only CPU metric that does
    not measure provisioned throughput units at all. It would have shipped as apparent coverage while
    detecting nothing — the exact failure mode the provenance discipline exists to prevent. See the honest
    gap in cost.surprise_line.
decision:
- id: q-actiongroup
  question: Which Action Group gets notified?
  why_it_matters: The rules can be created without one. They will evaluate correctly and appear in Azure
    Monitor, and nobody will ever be told when they fire. For a data-loss alert that is almost never the
    intent, so the template warns loudly in the portal when the field is left empty.
  ask_who: Whoever owns the on-call rotation — usually not the person deploying
  options:
  - value: An existing Action Group
    leads_to: bicep
    note: Supply the full resource ID. Strongly recommended.
  - value: None yet, attach one later
    leads_to: bicep
    note: Valid only if someone actually returns to do it. Set createDisabled=true as a reminder.
- id: q-stall-window
  question: How long may outgoing traffic stay flat before it counts as a stall?
  why_it_matters: Too short and a normal quiet period pages someone at 3am. Too long and you burn retention
    before anyone knows — and retention is the entire recovery window. Set it comfortably longer than
    the Abstract consumer's poll interval and comfortably shorter than the hub's message retention.
  ask_who: Whoever knows the consumer's poll interval
  options:
  - value: 30 minutes (default)
    leads_to: bicep
  - value: Longer, on a low-volume or bursty hub
    leads_to: bicep
    note: Raise minIncomingToAlert too, so a genuinely idle hub does not alert.
- id: q-review-first
  question: Enable immediately, or create disabled and review?
  why_it_matters: On a noisy or poorly-understood estate, thresholds tuned in the abstract can generate
    noise on day one, and an alert that cried wolf gets muted permanently.
  ask_who: The operations team who will receive these
  options:
  - value: Enable immediately
    leads_to: bicep
  - value: Create disabled, review thresholds, then enable
    leads_to: bicep
    note: createDisabled=true.
prereqs:
  identity:
  - principal: deployer
    role: Monitoring Contributor
    scope: the resource group holding the Event Hubs namespace
    why: Create metric alert rules and scheduled query rules.
    least_privilege_alternative: Contributor works but is broader than needed.
  resources:
  - An existing Event Hubs namespace — deploy azure.event-hub.source first.
  - An Action Group, if anyone is to be notified.
  settings:
  - The consumer-stall rule queries the AzureMetrics table, so the namespace's platform metrics must be
    reaching a Log Analytics workspace the rule can read. Confirm this before assuming the rule is working.
  lead_time: Metric alerts begin evaluating within minutes. Allow one full window before expecting a first
    evaluation.
console_walkthrough:
- step: 1
  action: Confirm the namespace exists and is receiving data
  where: Azure portal → Event Hubs → the namespace → Metrics
  expected: Incoming Messages shows a continuous non-zero line.
  gotcha: Deploying alerts against a namespace that never worked means the first alert fires immediately
    and correctly, which reads like a false positive.
  image:
    path: assets/diagrams/azure-eventhub-health-alerts.png
    alt: Event Hubs metrics on the left — IncomingMessages healthy while OutgoingBytes is zero — feeding
      a scheduled query rule and a metric alert in Azure Monitor, both attached to an action group
    caption: 'The stall signature is **IncomingMessages healthy while OutgoingBytes is zero**. It has
      to be caught by a scheduled query rule whose KQL always returns a row: a metric alert on a sparse
      Sum may never evaluate at all, so it fails exactly when you need it.'
    source: drawio
    license: vendor-icon-set
    altered: false
    captured: '2026-08-26'
    tenant_safe: true
- step: 2
  action: Create or identify the Action Group
  where: Azure portal → Monitor → Alerts → Action groups
  expected: An Action Group with at least one working notification channel.
  gotcha: Test it. An Action Group with an unverified email or a dead webhook is indistinguishable from
    no Action Group at all until the day it matters.
- step: 3
  action: Deploy the alerts template into the namespace's resource group
  where: Deploy-to-Azure button, or az deployment group create
  expected: Five alert rules created, named with the chosen prefix.
  gotcha: The rules bind to ONE namespace. A multi-region estate needs one deployment per namespace —
    the region rule that forces multiple namespaces forces multiple alert deployments too.
- step: 4
  action: Verify the consumer-stall rule actually evaluates
  where: Azure portal → Monitor → Alerts → Alert rules → the stall rule → History
  expected: Evaluations appear on schedule with a result, not "Insufficient data".
  gotcha: This is THE check. If the rule shows Insufficient data, the KQL is not returning rows — which
    usually means the namespace's platform metrics are not reaching a workspace the rule can query. An
    alert that never evaluates is worse than no alert, because it looks like coverage.
artifacts:
- kind: bicep
  external_path: templates/azure/bicep/monitoring/pipeline-health-alerts.bicep
  provenance: validated
  recommended: true
  scope: resourceGroup
  idempotent: true
  destructive_risk: Creates alert rules only. Re-running updates them in place; it touches no data-plane
    resource.
  validation:
    command: python3 solutions/scripts/validate-templates.py
    result: 'All 10 template(s) valid. 9 warning(s). — templates/monitoring/pipeline-health-alerts.bicep:
      resourceGroup / createUiDefinition / ok'
    run_on: '2026-08-25'
    tool_version: Bicep CLI 0.44.1, Azure CLI 2.87.0
  note: 'Authored 2026-08-25 in response to this corpus''s own review findings. Two bugs were caught during
    authoring by compiling rather than by reading: Bicep does NOT interpolate inside a triple-quoted multi-line
    string, so the KQL originally shipped the literal text ${consumerStallWindowMinutes} — the parameters
    showed as "declared but never used", which is what exposed it. The query is now built with replace()
    over sentinel tokens.'
- kind: arm-json
  external_path: templates/azure/bicep/monitoring/pipeline-health-alerts.azuredeploy.json
  provenance: validated
  scope: resourceGroup
  validation:
    command: 'python3 solutions/scripts/validate-templates.py  # recompiles every .bicep and fails if
      the committed ARM is stale'
    result: no drift — ARM matches the Bicep source
    run_on: '2026-08-25'
    tool_version: Bicep CLI 0.44.1
- kind: arm-ui
  external_path: templates/azure/bicep/monitoring/pipeline-health-alerts.createUiDefinition.json
  provenance: validated
  scope: resourceGroup
  validation:
    command: 'python3 solutions/scripts/validate-templates.py  # checks every UI output is a real template
      parameter and every required parameter is supplied'
    result: ok — passed the UI-contract check with no warnings
    run_on: '2026-08-25'
  note: Carries a dedicated "What this does not cover" step explaining the Auto-Inflate gap and why the
    stall rule is a log search rather than a metric alert. Surfacing a known gap in the deployment wizard
    is better than burying it in a README nobody opens.
delivery_surfaces:
- console
- cli
- ci-github-actions
- ci-azure-devops
verification:
- check: The five rules exist and are enabled
  where: cloud-cli
  command: 'az monitor metrics alert list -g <rg> --query "[?contains(name,''abstract-eh'')].{name:name,enabled:enabled,severity:severity}"
    -o table

    az monitor scheduled-query list -g <rg> --query "[?contains(name,''abstract-eh'')].{name:name,enabled:enabled}"
    -o table

    '
  healthy: Four metric alerts and one scheduled query rule, all enabled.
  unhealthy_means: A missing scheduled query rule means the log-search rule failed to deploy — check the
    workspace linkage.
- check: The consumer-stall rule is actually EVALUATING, not sitting in Insufficient data
  where: cloud-console
  healthy: Monitor → Alert rules → the stall rule → History shows evaluations on schedule with a result.
  unhealthy_means: '"Insufficient data" means the KQL returns no rows, which usually means the namespace''s
    platform metrics are not reaching a queryable workspace. The rule looks deployed and detects nothing.'
- check: The alert path works end to end
  where: cloud-console
  healthy: Fire a test notification from the Action Group and confirm it arrives.
  unhealthy_means: An Action Group with an unverified email or dead webhook is indistinguishable from
    no alerting until the day it matters.
- check: Deliberately stall the consumer in a lab and confirm the alert fires
  where: cloud-console
  healthy: Stop the Abstract integration, wait one stall window plus one evaluation interval, and confirm
    the alert fires.
  unhealthy_means: The only test that proves the whole chain. Everything above proves configuration; this
    proves detection. Do it once per deployment pattern, not once per customer.
troubleshooting:
- symptom: The consumer-stall rule shows "Insufficient data" forever and never fires
  likely_cause: The KQL is returning no rows — usually because the namespace's platform metrics are not
    flowing to a Log Analytics workspace the rule can query.
  check: Run the rule's KQL by hand in Logs against the workspace. Does the AzureMetrics table contain
    rows for this ResourceId?
  fix: Add a diagnostic setting on the NAMESPACE ITSELF sending metrics to a workspace — monitoring the
    monitor. Note this is a different diagnostic setting from the ones sending your estate's logs INTO
    the hub.
- symptom: The stall alert fires overnight every night on a low-volume hub
  likely_cause: Genuine idle period. Incoming stays above minIncomingToAlert but the consumer legitimately
    has nothing to do.
  check: Compare the alert times against the hub's traffic profile.
  fix: Raise minIncomingToAlert, lengthen consumerStallWindowMinutes, or both. Do not simply mute the
    rule.
- symptom: Alerts were created but nobody is notified
  likely_cause: actionGroupId was left empty. The rules evaluate correctly and notify nobody.
  check: az monitor metrics alert show, and look at the actions array.
  fix: Attach an Action Group. The portal warns about this at deploy time, but a CLI deployment does not.
  silent: true
- symptom: The bill rose after a traffic spike and no alert mentioned it
  likely_cause: The Auto-Inflate ratchet, which this template deliberately does NOT cover. Auto-Inflate
    scales throughput units up and never scales them back down, and Capture is metered per throughput
    unit.
  check: Namespace → Scale. Compare provisioned TUs against steady-state need.
  fix: Lower the count by hand. To detect it automatically you need the AutoScaleLogs diagnostic category
    on the namespace, which requires a diagnostic setting this template cannot assume exists.
cost:
  drivers:
  - driver: Metric alert rules
    charged_on: per rule per month, with a small free allocation
    side: customer-cloud
    note: Four rules. Trivial against the cost of losing a day of security logs.
  - driver: Scheduled query (log search) alert rule
    charged_on: per rule per month, plus the Log Analytics query cost
    side: customer-cloud
    note: One rule, evaluating every 5 minutes over a small metric aggregation.
  surprise_line: 'Not a cost surprise but a COVERAGE one, and it belongs here because it is a cost failure:
    this template does not alert on the Auto-Inflate ratchet. There is no platform metric for provisioned
    throughput units — the scale events land only in the AutoScaleLogs diagnostic category. An earlier
    draft used NamespaceCpuUsage and was removed for measuring the wrong thing. Review provisioned TUs
    by hand monthly until AutoScaleLogs is wired up.'
  volume_shape: Fixed cost per namespace. Does not scale with data volume.
detections_unlocked:
- detection: Collection stopped — consumer stalled (pipeline integrity, not an attack)
  acs_fields: []
- detection: Collection stopped — producer side, which is also the signature of a deleted diagnostic setting
  acs_fields: []
  mitre:
  - T1562.008
reviews:
  cloud_architect: 'This node exists because of a finding from the Event Hub review: **there are three
    independent paths to permanent, unalarmed loss of security logs, and every Event Hubs health dashboard
    stays green through all of them.**


    **This closes the first and most likely — the stalled consumer.**


    **The second — retention expiring behind a stalled consumer — is closed transitively.** The stall
    alert fires long before retention runs out, provided the window is set sensibly.


    **The third is NOT closed by this template.** A lost checkpoint container causing a resume from "latest"
    is best removed *structurally*, by using Kafka ingestion mode — which commits offsets to Event Hubs
    instead of to blob storage.'
  devops: '**Deploy it in the same pipeline stage as the namespace**, not as a follow-up someone forgets.


    The rules are idempotent and touch no data-plane resource, so re-running is safe.


    **One deployment per namespace.** The region rule that forces multiple namespaces forces multiple
    alert deployments too — and a multi-region estate with alerts on only one namespace is the easy mistake
    here.'
  security_iam: 'Deployment needs only Monitoring Contributor on the resource group.


    **Worth noting for the threat model: the ingestion-stopped alert doubles as detection for the blinding
    attack.** Deleting a diagnostic setting to stop telemetry produces exactly the signature this rule
    watches for.


    It is a weaker signal than an Activity Log alert on the delete operation — but it survives the case
    where the Activity Log stream itself was the thing deleted.'
  finops: ''
  soc: '**Pair this with absence-of-data alerting on the Abstract side.**


    This template watches the **transport**. Only Abstract can tell you that a *specific source* stopped
    while the hub as a whole stayed busy — a single subscription going dark inside a large estate does
    not move namespace-level metrics at all.


    Key the Abstract-side alert on `ingested_time` rather than the event timestamp, group by dataset and
    account, and give it a **same-window-7-days-ago arm as its own positive control**.'
faq:
- q: Why is the consumer alert a log search instead of a normal metric alert?
  a: Because a metric alert does not work here. Event Hubs metrics are sparse — with nothing consuming,
    the platform emits no outgoing datapoints at all rather than zeros, so a metric alert has nothing
    to evaluate and sits in "Insufficient data" forever. The KQL synthesises a zero row when the metric
    is silent, which makes "no data" and "zero throughput" the same alertable condition.
- q: Can we just alert on consumer lag?
  a: '**On Standard, no** — there is no consumer-lag metric on that tier, and no equivalent of Kafka''s
    consumer offset lag. That absence is the entire reason this template has to infer the failure from
    `OutgoingBytes` instead.


    **On Premium and Dedicated there IS one.** `ConsumerLag` is published as a field in ApplicationMetricsLogs.
    It needs a diagnostic setting on the namespace sending that category to a workspace, so it is not
    a drop-in replacement for these rules — but on a pipeline that genuinely matters it is a real argument
    for Premium, not just a retention argument.'
- q: Why is there no alert for the Auto-Inflate cost ratchet?
  a: Because there is no platform metric for provisioned throughput units. The scale events go to the
    AutoScaleLogs diagnostic category, which needs a diagnostic setting on the namespace itself sending
    to a workspace — a dependency this template cannot assume. An earlier draft alerted on NamespaceCpuUsage,
    which is a Premium-only CPU metric that does not measure throughput units at all; it was removed rather
    than shipped as false comfort.

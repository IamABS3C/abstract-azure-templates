reviews:
  cloud_architect: 'Tenant scope makes this the **simplest node in the Azure set architecturally, and
    the most awkward operationally.**


    **Simplest**, because it is deployed once and is completely indifferent to subscription count, region
    and management-group hierarchy. The region rule that forces one namespace per region for resource
    logs does not apply — an Entra tenant is not a regional resource.


    **Awkward**, because tenant scope means no portal path, a directory role rather than an Azure role,
    and no policy plane to keep it healthy.


    **Give identity its own hub.** Sign-in volume is bursty and Graph activity can dominate a namespace,
    so sharing retention with resource logs means one source evicts the other.


    **Design the tenant topology first.** Entra logs cannot cross tenants, so a multi-tenant customer
    needs one hub per tenant — and that is not retrofittable.'
  devops: '**This is a CLI or pipeline deployment, full stop** — `az deployment tenant create`, no portal
    button, because no portal UI model binds above a resource group for this provider.


    **Terraform reaches parity** via `azurerm_monitor_aad_diagnostic_setting` — the one tenant-scope Azure
    Monitor resource people wrongly assume Terraform cannot do. Every destination field is ForceNew, and
    it needs Contributor at `/providers/Microsoft.aadiam`.


    **The redeploy behaviour is the trap.** Changing the category list **replaces** it rather than merging,
    so read the existing setting before you change it.


    Run it once per tenant and treat it as set-and-forget — but **add a scheduled read-back**, because
    nothing else will tell you it was deleted.'
  security_iam: '**The Security Administrator *directory* role is the single biggest scope surprise in
    the whole Azure onboarding.**


    An Azure subscription Owner cannot create this. A management-group Owner cannot create this. Global
    Administrator works but is more than required.


    **Identify that person before the session.** This is where onboardings lose days.


    Creating the setting also needs `ListKey` on the Event Hub authorization rule — a permission distinct
    from writing the setting itself.


    **The delivery identity is not a managed identity.** Azure Monitor resolves the key from the referenced
    SAS rule, and no managed-identity option is documented for the Event Hubs destination. So a SAS-free
    namespace stays impossible while diagnostic settings are a producer.


    **Worth stating to any regulated customer:** there is no policy plane here. Deletion of the highest-value
    identity feed is invisible to governance, and has to be caught by absence-of-data alerting instead.'
  finops: 'The setting is free; the volume is not, and it lands on the Event Hub node''s bill.


    **Two figures worth quoting rather than estimating.** Microsoft states non-interactive and service-principal
    sign-ins run **5–10× larger** than interactive, and publishes Graph activity logs at roughly **1,000
    GiB/month for a 100,000-user tenant**.


    **Remember the Azure Monitor platform-logs per-GB export charge.** Teams model it at zero because
    the diagnostic-setting *resource* is free — a different thing entirely.


    **The cheapest real reduction** is declining `MicrosoftServicePrincipalSignInLogs` and the Global
    Secure Access categories. Both cost volume and return little or nothing.'
  soc: 'Entra `AuditLogs` and interactive `SignInLogs` are among the highest security value per GB on
    the whole Azure path — second only to the Activity Log `Administrative` category. **Defer** `NonInteractiveUserSignInLogs`
    until volume is measured.


    **The critical scoping fact: roughly half of a serious Entra detection set is not reachable through
    this node at all.** The deepest Entra parsing lives on the `microsoft_graph_api` poll integration,
    which needs Entra P1. Do not promise an identity detection programme on Event Hub alone.


    Plan for **24 hours to 3 days** before first data, with no backfill.


    And note the absence of any policy plane: a deleted setting is invisible unless you are alerting on
    absence of the identity dataset specifically.'
faq:
- q: Can Azure Policy manage this like it does subscription diagnostic settings?
  a: No, and not because of a missing feature — there is nothing per-subscription to evaluate, so DeployIfNotExists
    cannot reach a tenant-scope setting. Azure ships no policy plane for Entra logs at all. It is the
    only part of the Azure path with no governance backstop, which means a deleted setting is not re-created
    and must be caught by absence-of-data alerting.
- q: Why is there no Deploy-to-Azure button?
  a: No portal UI model binds a deployment above a resource group for this provider. Tenant scope is a
    CLI or PowerShell deployment. That is Azure's constraint, not the template's.
- q: Do we need Entra ID P1 or P2?
  a: For some categories. Microsoft's licensing table lists audit and sign-in logs as available on **Free**;
    Provisioning logs and Graph activity logs require P1/P2, and the Identity Protection risk categories
    require P2. The widely-repeated claim that non-interactive and service-principal sign-in EXPORT needs
    P1 is not documented anywhere in Microsoft's monitoring-health docs — the real P1/P2 gate is on downloading
    sign-in logs via the Graph API, which is a different operation.
- q: Nothing has arrived and it has been an hour. Is it broken?
  a: Almost certainly not. Entra first data takes 24 hours to 3 days — Microsoft's own docs give three
    different figures across three live pages, and the 90-minute number people remember is for Azure resource
    logs, not Entra. Set this expectation before deploying.
- q: We have two Entra tenants. Can one Event Hub serve both?
  a: No. Azure resource logs can cross subscriptions and, with Lighthouse, tenants — but Microsoft is
    explicit that for Entra logs the subscription and Event Hubs namespace must both be associated with
    the tenant the logs come from. One hub per tenant, decided before you deploy any of them.

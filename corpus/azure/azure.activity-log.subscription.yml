id: azure.activity-log.subscription
title: One subscription's Activity Log → Event Hub
cloud: azure
service: Azure Monitor Activity Log (subscription-scope diagnostic setting)
direction: source
transport: event-hub
status: ga
provenance: validated
owner: Solutions Engineering
last_reviewed: '2026-08-26'
summary: The pilot path. Streams ONE subscription's Activity Log — every ARM create, update and delete,
  and every RBAC change — to the Abstract Event Hub. Highest security value per GB on the whole Azure
  path, because Microsoft states the Administrative category "doesn't typically capture read operations",
  so it stays small while carrying almost everything an investigator wants. Use it to prove the pipeline
  on one subscription, then move to the management-group policy for the estate.
when_to_use: A genuine single-subscription estate, a pilot, or a proof on one subscription before committing
  to estate-wide governance. Also the right choice when the customer will not grant management-group rights
  yet, which is common early in an engagement.
when_not_to_use: Any estate you intend to cover fully. This setting covers exactly one subscription forever
  — nothing re-creates it if deleted, and nothing extends it to a subscription created next month. Do
  not deploy it N times as a substitute for the policy pack; that is the toil the policy pack exists to
  remove.
scopes:
- subscription
covers_future_accounts: false
mechanism_note: A subscription diagnostic setting is bound to that one subscription. There is no inheritance
  and no self-healing. Estate coverage requires azure.policy.log-streams at management-group scope.
abstract_integration:
  id: default.azure_eventhub.0_7_1
  name: Azure EventHub
  mode: PULL
  verified_on: '2026-08-25'
alternatives_rejected:
- option: Deploy this once per subscription across the estate
  why_not: Linear toil that silently decays. Nothing re-creates a deleted setting and nothing covers a
    subscription created after the last pass. The management-group policy does both, and Azure Policy
    itself is free.
- option: Export the Activity Log to a storage account and read blobs
  why_not: Batches on a schedule rather than streaming, so detection latency becomes minutes to hours.
    Fine for archive, wrong for the live feed.
- option: Export all eight Activity Log categories
  why_not: Four of the eight carry effectively no detection signal — Alert, Autoscale, Recommendation
    and ResourceHealth — while adding real volume. The deploy script's defaults were corrected on 2026-08-25
    for exactly this reason.
decision:
- id: q-pilot-or-estate
  question: Is this a pilot, or the intended end state?
  why_it_matters: The honest answer changes the whole engagement. If it is the end state for a single-subscription
    customer, this node is correct and complete. If it is a pilot, say so out loud and schedule the policy
    conversation now — otherwise you end up with eleven hand-made settings and no way to know when one
    is deleted.
  ask_who: The account owner, not the engineer on the call
  options:
  - value: Pilot — estate follows
    leads_to: azure.policy.log-streams
    note: Deploy this to prove the pipeline, then move to management-group scope. Do not repeat this node
      per subscription.
  - value: Genuinely one subscription
    leads_to: bicep
  - value: Estate now
    leads_to: azure.policy.log-streams
- id: q-categories
  question: Which of the eight Activity Log categories?
  why_it_matters: Administrative, Security, ServiceHealth and Policy carry the detection value. Alert,
    Autoscale, Recommendation and ResourceHealth are high volume and near-zero signal — customers were
    paying to ingest them by default until this was corrected.
  ask_who: Security engineering
  options:
  - value: The four that matter (recommended)
    leads_to: bicep
    note: Administrative, Security, ServiceHealth, Policy.
  - value: All eight
    leads_to: bicep
    note: Only if something downstream genuinely consumes ResourceHealth or Autoscale. Usually nothing
      does.
- id: q-existing-settings
  question: How many diagnostic settings does this subscription already have?
  why_it_matters: The ceiling is FIVE per resource, and an existing export to Sentinel, a storage archive
    and another vendor can already consume it. The failure reads like a quota fault rather than a design
    constraint, and it surfaces at deploy time on a customer call.
  ask_who: Whoever owns the subscription's existing monitoring
  options:
  - value: Fewer than five — proceed
    leads_to: bicep
  - value: Already at five
    leads_to: stop:Consolidate an existing setting first. There is no way to raise the limit.
prereqs:
  identity:
  - principal: deployer
    role: Monitoring Contributor
    scope: the SUBSCRIPTION — not a resource group
    why: A subscription-scope diagnostic setting is not a resource-group resource. Resource-group rights
      are insufficient, which catches people who assume the hub's resource group is enough.
  - principal: deployer
    role: listKeys on the Event Hub authorization rule
    scope: the Event Hubs namespace, often in a DIFFERENT subscription
    why: Creating a diagnostic setting that streams to an Event Hub requires ListKey on the target authorization
      rule — a permission distinct from writing the setting. Undiscoverable until it fails, and the namespace
      usually lives in a hub subscription.
    least_privilege_alternative: A custom role with authorizationRules/read plus authorizationRules/listkeys/action,
      rather than Azure Event Hubs Data Owner.
  resources:
  - The Event Hub and a Send-capable authorization rule must already exist. Deploy azure.event-hub.source
    first.
  quotas_limits:
  - MAX 5 diagnostic settings per resource, including this subscription. Existing exports count.
  - A single setting can define at most ONE destination of each type.
  - A COMPACTED event hub cannot be used — it requires a partition key Azure Monitor does not supply.
  lead_time: Data should begin flowing within 90 minutes (Microsoft's documented figure for Azure resources
    — the Entra 24h-to-3-day figure does NOT apply here).
console_walkthrough:
- step: 1
  action: Confirm the hub and its Send authorization rule exist
  where: Azure portal → Event Hubs → namespace → Shared access policies
  expected: A Send-capable rule and a hub for Activity Log data.
  gotcha: Note the full authorization-rule resource ID now — you will need it, and it is tedious to construct
    by hand.
  image:
    path: assets/diagrams/azure-activity-log-subscription.png
    alt: One Azure subscription's ARM control plane, RBAC changes and Defender alerts feeding the Activity
      Log, through a single diagnostic setting into one Event Hub
    caption: The Activity Log is **subscription scope and not regional**, so unlike resource logs a single
      Event Hub serves every subscription regardless of region. That is what makes this the cheapest Azure
      path to stand up.
    source: drawio
    license: vendor-icon-set
    altered: false
    captured: '2026-08-26'
    tenant_safe: true
- step: 2
  action: Open the subscription's Activity Log export settings
  where: Azure portal → Subscriptions → the subscription → Activity log → Export Activity Logs
  expected: Existing settings listed, if any.
  gotcha: Count them. Five is the ceiling and a mature subscription is often already at three or four.
- step: 3
  action: Add a diagnostic setting, selecting the four high-value categories
  where: Same blade → + Add diagnostic setting
  expected: A named setting with Administrative, Security, ServiceHealth and Policy ticked.
  gotcha: Name it something an operator will recognise as load-bearing. A generic name gets deleted during
    a cleanup.
- step: 4
  action: Choose Stream to an event hub and select the namespace and hub
  where: Same blade
  expected: Namespace and hub selectable.
  gotcha: The destination need not be in this subscription, but you need RBAC on both. If the namespace
    does not appear, it is a permission problem on the namespace side, not here.
- step: 5
  action: Save and verify within 90 minutes
  where: Event Hubs → the hub → Metrics → Incoming Messages
  expected: A non-zero, continuous line.
  gotcha: Generate a guaranteed event by making a trivial, reversible change — add and remove a tag on
    a resource group. Administrative is always on.
artifacts:
- kind: bicep
  external_path: templates/azure/bicep/subscription/activitylog.bicep
  provenance: validated
  recommended: true
  scope: subscription
  idempotent: true
  destructive_risk: Re-running with a different category list REPLACES the selection on that named setting
    rather than merging it.
  validation:
    command: python3 solutions/scripts/validate-templates.py
    result: 'All 10 template(s) valid. — templates/subscription/activitylog.bicep: subscription / uiFormDefinition
      / ok'
    run_on: '2026-08-26'
    tool_version: Bicep CLI 0.44.1, Azure CLI 2.87.0
- kind: arm-json
  external_path: templates/azure/bicep/subscription/activitylog.azuredeploy.json
  provenance: validated
  scope: subscription
  validation:
    command: 'python3 solutions/scripts/validate-templates.py  # recompiles every .bicep and fails if
      the committed ARM is stale'
    result: no drift — committed ARM matches the Bicep source
    run_on: '2026-08-26'
    tool_version: Bicep CLI 0.44.1
- kind: arm-ui
  external_path: templates/azure/bicep/subscription/activitylog.uiFormDefinition.json
  provenance: validated
  scope: subscription
  validation:
    command: python3 solutions/scripts/validate-templates.py
    result: ok — UI outputs all map to real template parameters
    run_on: '2026-08-26'
  note: 'A Form view rather than a createUiDefinition, and necessarily so: createUiDefinition cannot bind
    a portal deployment to a subscription. This is why most vendor solutions offer no portal path at subscription
    scope at all.'
- kind: azure-cli
  provenance: schema-reviewed
  scope: subscription
  inline: "# Subscription scope — note `az deployment sub`, not `group`.\naz deployment sub create \\\n\
    \  --location eastus \\\n  --template-file solutions/templates/subscription/activitylog.bicep \\\n\
    \  --parameters eventHubAuthorizationRuleId=\"<send-rule-resource-id>\" \\\n               eventHubName=abs-prod-activity\n\
    \n# Count existing settings BEFORE deploying — five is the ceiling.\naz monitor diagnostic-settings\
    \ subscription list \\\n  --query \"value[].{name:name,eventHub:eventHubName}\" -o table\n\n# Verify\
    \ after\naz monitor diagnostic-settings subscription list \\\n  --query \"value[?name=='<setting-name>'].logs[?enabled].category\"\
    \ -o tsv\n"
- kind: terraform
  provenance: schema-reviewed
  scope: subscription
  inline: "# azurerm_monitor_diagnostic_setting against the subscription's own resource ID.\n# Written\
    \ to the current provider schema; NOT validated or applied.\ndata \"azurerm_subscription\" \"current\"\
    \ {}\n\nresource \"azurerm_monitor_diagnostic_setting\" \"activity_log\" {\n  name               \
    \            = \"abstract-activitylog\"\n  target_resource_id             = data.azurerm_subscription.current.id\n\
    \  eventhub_authorization_rule_id = var.eventhub_send_rule_id\n  eventhub_name                  =\
    \ \"abs-prod-activity\"\n\n  # The four that carry detection value. Alert / Autoscale / Recommendation\
    \ /\n  # ResourceHealth are high volume and near-zero signal.\n  enabled_log { category = \"Administrative\"\
    \ }\n  enabled_log { category = \"Security\" }\n  enabled_log { category = \"ServiceHealth\" }\n \
    \ enabled_log { category = \"Policy\" }\n}\n"
  note: Terraform adds removal reconciliation that ARM Incremental mode lacks — dropping an enabled_log
    block here actually removes it, whereas a Bicep redeploy is additive. That is a genuine advantage
    for a platform team managing this long-term.
delivery_surfaces:
- console
- cli
- ci-github-actions
- ci-azure-devops
- terraform-cloud
verification:
- check: The setting exists with the intended categories
  where: cloud-cli
  command: az monitor diagnostic-settings subscription list --query "value[].{name:name,hub:eventHubName,cats:logs[?enabled].category}"
    -o json
  healthy: The named setting present, pointing at the expected hub, with the four categories enabled.
  unhealthy_means: Absent means the deployment did not run at subscription scope, or Monitoring Contributor
    was held only at resource-group scope.
- check: Messages arriving on the Activity Log hub
  where: cloud-console
  healthy: Incoming Messages non-zero within 90 minutes.
  unhealthy_means: Zero after 90 minutes means the Send rule, the ListKeys grant, or the namespace firewall
    denying without the trusted-services bypass. Check per hub, not per namespace.
- check: A deliberate control-plane action appears end to end
  where: abstract-ui
  command: 'az group update -n <a-test-rg> --tags probe=abstract   # then remove it'
  healthy: The tag write appears in Abstract within minutes, with the acting identity populated.
  unhealthy_means: This is the only check that proves the whole chain including the parser. Administrative
    is always on, so it cannot fail for licensing reasons.
- check: The acting identity is populated, not just the operation
  where: abstract-ui
  healthy: Spot-check that related.user and cloud.project_id are set on the probe event.
  unhealthy_means: azure_eventhub 0.7.1 specifically fixed subscription-vs-tenant confusion in cloud.project_id
    and identity being dropped on some event types. Check the integration version and diff the config's
    parsers before reporting a platform defect.
troubleshooting:
- symptom: Deployment fails with an authorization error naming the Event Hub
  likely_cause: Missing ListKeys on the authorization rule. It is a separate permission from writing the
    diagnostic setting, and the namespace is usually in another subscription.
  check: Confirm rights on the namespace, not just on the subscription being onboarded.
  fix: Grant authorizationRules/read plus authorizationRules/listkeys/action on the rule, ideally via
    a custom role rather than Data Owner.
- symptom: Deployment fails and the message mentions a limit
  likely_cause: The subscription already has five diagnostic settings.
  check: az monitor diagnostic-settings subscription list, and count.
  fix: Consolidate an existing setting. The limit cannot be raised.
- symptom: Everything looks configured and no events arrive
  likely_cause: The namespace firewall is in Deny mode without the trusted-services bypass, so Azure Monitor's
    own delivery is blocked.
  check: Namespace → Networking → default action and the trusted-services setting.
  fix: Allow trusted Microsoft services. Azure Monitor delivery needs that bypass whenever the firewall
    denies by default.
  silent: true
- symptom: Volume is far higher than expected for an Activity Log
  likely_cause: All eight categories were exported, including Alert, Autoscale, Recommendation and ResourceHealth.
  check: Inspect the enabled category list on the setting.
  fix: Reduce to Administrative, Security, ServiceHealth and Policy. Note routing is evaluated at write
    time — there is no backfill, but there is also no penalty for narrowing going forward.
- symptom: The setting vanished and nobody knows when
  likely_cause: A subscription-scope setting has no self-healing. Someone deleted it during a cleanup,
    or a subscription was moved and re-provisioned.
  check: Compare against a known-good inventory.
  fix: Re-deploy — and take this as the signal to move to azure.policy.log-streams, which puts a deleted
    setting back automatically. Alert on absence of the dataset in the meantime.
  silent: true
cost:
  drivers:
  - driver: Activity Log volume into the hub
    charged_on: Event Hub ingress, throughput units, egress
    side: customer-cloud
    note: Modest for the four high-value categories. This is not the expensive Azure source.
  - driver: The diagnostic setting
    charged_on: nothing — free
    side: customer-cloud
  - driver: Azure Monitor Platform Logs export
    charged_on: per GB exported
    side: customer-cloud
    note: Modelled at zero by almost everyone because the setting itself is free. Different thing.
  surprise_line: Exporting all eight categories. Alert, Autoscale, Recommendation and ResourceHealth add
    real volume and near-zero detection value, and they were in the deploy script's defaults until 2026-08-25
    — so any subscription onboarded before that date is probably paying for them right now. Worth checking
    on existing customers rather than only fixing it going forward.
  volume_shape: Low and predictable relative to Entra sign-ins or resource logs, because Microsoft states
    the Administrative category "doesn't typically capture read operations". Scales with change rate,
    not with resource count.
  savings:
  - Four categories instead of eight.
  - Moving to the management-group policy removes the per-subscription effort entirely, and Azure Policy
    is free.
detections_unlocked:
- detection: Diagnostic setting deleted (the blinding attack)
  acs_fields:
  - action
  - related.user
  mitre:
  - T1562.008
- detection: Role assignment to Owner or a privileged role
  acs_fields:
  - action
  - related.user
  mitre:
  - T1098
- detection: NSG or firewall rule opened to 0.0.0.0/0
  acs_fields:
  - action
  - related.user
  mitre:
  - T1562.004
- detection: Mass resource deletion
  acs_fields:
  - action
  - related.user
  mitre:
  - T1485
- detection: Key Vault management-plane operation (note secret READS need the Key Vault AuditEvent resource
    log, not this)
  acs_fields:
  - action
  - related.user
  mitre:
  - T1552
- detection: Policy exemption created to carve a scope out of monitoring
  acs_fields:
  - action
  - related.user
  mitre:
  - T1562.001
reviews:
  cloud_architect: 'Architecturally trivial and strategically important.


    **It is the cheapest way to prove the whole pipeline end to end on one subscription** before asking
    for management-group rights — which is often the real blocker early in an engagement.


    Subscription scope means a Form-view UI rather than `createUiDefinition`, and Monitoring Contributor
    at the **subscription** rather than the resource group.


    **Unlike resource logs, the Activity Log is not regional.** One hub serves every subscription regardless
    of where their resources sit, so the region rule that forces one namespace per region simply does
    not apply here.


    Treat this as a stepping stone, and say so. Deploying it repeatedly is the anti-pattern the policy
    pack exists to eliminate.'
  devops: 'Idempotent, but **ARM Incremental mode is additive.** Changing the category list on a redeploy
    replaces that setting''s selection, whereas dropping a category from Terraform actually removes it
    — a real advantage for long-term management.


    **Count existing settings before deploying.** Five is a hard ceiling and a mature subscription is
    often already at three or four, so the failure lands mid-demo.


    **If you are deploying this more than twice, stop and deploy the policy pack instead.**'
  security_iam: '**Two scope traps, both common.**


    **Monitoring Contributor is needed at the SUBSCRIPTION.** A subscription diagnostic setting is not
    a resource-group resource, so resource-group rights fail.


    **Creating it requires `ListKeys` on the Event Hub authorization rule**, which normally lives in a
    different subscription entirely. Prefer a custom role limited to `authorizationRules/read` plus `listkeys/action`
    over `Azure Event Hubs Data Owner` — that one grants `Microsoft.EventHub/*` and lets the holder delete
    the hub.


    **This setting has no self-healing.** Deleting it is a single-step way to blind the SOC for one subscription,
    and only the policy pack or absence-of-data alerting catches it.'
  finops: 'The cheapest high-value Azure source — and the one place where a default was actively costing
    customers money.


    **The deploy script exported `Alert`, `Autoscale`, `Recommendation` and `ResourceHealth` until 2026-08-25.**
    All high volume, near-zero signal.


    **Any subscription onboarded before that date is likely still paying for them.** That is worth an
    audit pass across existing customers, not just a fix for new ones.


    Four categories instead of eight is the entire optimisation here.'
  soc: '**The `Administrative` category is the highest security value per GB anywhere on the Azure path**
    — every ARM create, update and delete, plus every RBAC change. By Microsoft''s own statement it "doesn''t
    typically capture read operations", so it stays small. `Security` carries Defender for Cloud alerts
    and is effectively free.


    **Two scoping facts worth stating out loud.**


    Key Vault **secret reads are not here.** The subscription Activity Log carries management-plane vault
    operations only; `SecretGet` requires the Key Vault `AuditEvent` resource log.


    A resource-scoped **diagnostic-setting deletion does land in this stream** — which makes this the
    observer for the blinding attack. Right up until someone deletes *this* setting, at which point nothing
    observes anything and only absence-of-data alerting notices.'
faq:
- q: Should we just deploy this to all our subscriptions?
  a: No. It covers exactly one subscription forever, with no self-healing and no coverage of subscriptions
    created later. Deploy it once to prove the pipeline, then assign azure.policy.log-streams at a management
    group — Azure Policy is free and it puts a deleted setting back.
- q: Which categories should we enable?
  a: Administrative, Security, ServiceHealth and Policy. Alert, Autoscale, Recommendation and ResourceHealth
    are high volume with effectively no detection value; they were in the deploy script's defaults until
    2026-08-25.
- q: Why is there no Deploy-to-Azure button like the Event Hub template has?
  a: There is one, but it uses a Form view rather than the usual createUiDefinition, because createUiDefinition
    physically cannot bind a portal deployment to a subscription. That is why most vendor solutions offer
    no portal path at this scope at all.
- q: Can we see Key Vault secret reads with this?
  a: No. The subscription Activity Log carries management-plane vault operations only. Secret reads (SecretGet)
    come from the Key Vault AuditEvent resource log, which is collected by the resource-log initiative
    in the policy pack.
- q: How long until data appears?
  a: Within 90 minutes, per Microsoft's documented figure for Azure resources. Do not apply the Entra
    24-hour-to-3-day figure here — different provider, different timing.
